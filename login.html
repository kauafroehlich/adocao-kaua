<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adocão - Tela Inicial</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="back-secundario">

    <div align="center">
        <div class="content" align="left">
            <!-- AQUI VAI OS TEXTOS DE APOIO -->
            <h1 class="title-2 top7">Login!</h1>
            <p style="margin-top:-15px; margin-bottom: 30px" class="text-info2">Complete os campos para começar.</p>
            <!-- AQUI VAI O INPUT  -->
             <form>
                <input  class="input-primary top2" type="text" placeholder="E-mail"></input>
                <input  class="input-primary top2" type="password" placeholder="Senha"></input>
             </form>
            <!-- AQUI VAI TEXTO DA SENHA -->
            <p class="text-info3" style="text-align: right;">Esqueci minha senha</p>
            <!-- AQUI VAI O BOTÃO -->
            <button class="btn-primary top2">Entrar</button>
            <p class="text-info4">Ainda não tem uma conta? <span class="text-info4" style="text-decoration: underline">Cadastrar</span></p>
            <p class="text-info4" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 70%;">Ao entrar, aceito os <strong>Termos de Uso</strong> e <strong>Política de Privacidade</strong></p>
        </div>
    </div>

</body>

</html>
